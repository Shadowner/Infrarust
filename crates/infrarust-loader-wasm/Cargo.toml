[package]
name = "infrarust-loader-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
description = "WebAssembly (Component Model) plugin loader for Infrarust"
keywords = ["minecraft", "proxy", "plugin", "wasm", "wasmtime"]
categories = ["game-development", "wasm"]
exclude = ["tests/fixtures"]

[package.metadata.docs.rs]
features = ["wasm"]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
infrarust-api = { workspace = true }
infrarust-plugin-wit = { workspace = true }
infrarust-plugin-common = { workspace = true }
infrarust_config = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

wasmtime = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
wasmtime-wasi-http = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
http = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
rustls-platform-verifier = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["user"], optional = true }

[dev-dependencies]
wasmtime = { workspace = true, features = ["wat"] }
infrarust-api = { workspace = true, features = ["test-util"] }
infrarust-core = { workspace = true, features = ["test-support"] }
infrarust_config = { workspace = true }
infrarust-plugin-stats-native = { workspace = true }
infrarust-test-harness = { path = "../infrarust-test-harness" }
infrarust_protocol = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
tokio-util = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }

[features]
default = []
wasm = [
    "dep:wasmtime",
    "dep:wasmtime-wasi",
    "dep:sha2",
    "dep:tempfile",
    "dep:nix",
    "dep:tokio",
    "dep:tokio-util",
    "dep:futures-util",
    "dep:bytes",
    "dep:uuid",
    "dep:wasmtime-wasi-http",
    "dep:hyper",
    "dep:http",
    "dep:http-body-util",
    "dep:rustls",
    "dep:tokio-rustls",
    "dep:rustls-platform-verifier",
]

[[bench]]
name = "codec_boundary"
harness = false

[[bench]]
name = "codec_exec"
path = "benches/codec_exec/main.rs"
harness = false

[[bench]]
name = "wasm_contract"
path = "benches/wasm_contract/main.rs"
harness = false
