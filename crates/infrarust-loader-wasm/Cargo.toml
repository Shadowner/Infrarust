[package]
name = "infrarust-loader-wasm"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
description = "WebAssembly (Component Model) plugin loader for Infrarust"
keywords = ["minecraft", "proxy", "plugin", "wasm", "wasmtime"]
categories = ["game-development", "wasm"]

[lints]
workspace = true

[dependencies]
infrarust-api = { workspace = true }
infrarust_config = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

wasmtime = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
infrarust-api = { workspace = true }
infrarust-core = { workspace = true }
infrarust_config = { workspace = true }
infrarust-plugin-stats-native = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }

[features]
default = []
wasm = [
    "dep:wasmtime",
    "dep:wasmtime-wasi",
    "dep:sha2",
    "dep:tokio",
    "dep:bytes",
    "dep:uuid",
]
