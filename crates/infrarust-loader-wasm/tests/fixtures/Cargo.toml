[workspace]
resolver = "2"
members = [
    "fixture-common",
    "hello",
    "trap-on-purpose",
    "cpu-spin",
    "memory-bomb",
    "event-subscriber",
    "event-modifier",
    "multi-handler",
    "host-caller",
    "command-plugin",
    "capability-denied",
    "sdk-smoke",
    "codec-modify",
    "codec-stateful",
    "limbo-handler",
]

[workspace.dependencies]
wit-bindgen = "0.58"
infrarust-plugin-sdk = { path = "../../../infrarust-plugin-sdk" }
infrarust-plugin-macros = { path = "../../../infrarust-plugin-macros" }
fixture-common = { path = "fixture-common" }

[profile.release]
opt-level = 1
lto = false
codegen-units = 16
strip = true
panic = "abort"

[profile.dev]
panic = "abort"
