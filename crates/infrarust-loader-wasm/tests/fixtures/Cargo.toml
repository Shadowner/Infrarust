[workspace]
resolver = "2"
members = [
    "hello",
    "trap-on-purpose",
    "cpu-spin",
    "memory-bomb",
    "event-subscriber",
    "event-modifier",
    "host-caller",
    "command-plugin",
    "capability-denied",
    "sdk-smoke",
]

[workspace.dependencies]
wit-bindgen = "0.51"
infrarust-plugin-sdk = { path = "../../../infrarust-plugin-sdk" }
infrarust-plugin-macros = { path = "../../../infrarust-plugin-macros" }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"

[profile.dev]
panic = "abort"
