[workspace]
resolver = "2"
members = [
    "fixture-common",
    "scripted",
    "scripted-peer",
    "trap-on-purpose",
    "cpu-spin",
    "memory-bomb",
    "host-caller",
    "command-plugin",
    "capability-denied",
    "codec-modify",
    "codec-stateful",
    "codec-std",
    "limbo-handler",
    "slow-handler",
    "deadline-probe",
    "old-world",
]

[workspace.dependencies]
wit-bindgen = "0.58"
infrarust-plugin-sdk = { path = "../../../infrarust-plugin-sdk" }
infrarust-plugin-macros = { path = "../../../infrarust-plugin-macros" }
fixture-common = { path = "fixture-common" }

[profile.release]
opt-level = 1
lto = false
codegen-units = 16
strip = true
panic = "abort"

[profile.dev]
panic = "abort"
