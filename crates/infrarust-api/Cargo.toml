[package]
name = "infrarust-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Plugin API for Infrarust, a Minecraft reverse proxy"
keywords = ["minecraft", "proxy", "plugin", "api"]
categories = ["game-development", "network-programming"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
bytes = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
uuid = { workspace = true }

[dev-dependencies]
# Doctest-only (crate-level plugin example).
tracing = { workspace = true }

[features]
default = []
serde = ["dep:serde"]
# Test-only helpers (e.g. a constructible LimboSession) for downstream crates.
test-util = []
