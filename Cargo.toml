[workspace]
resolver = "3"
members = [
    "crates/infrarust_protocol",
    "crates/infrarust-api",
    "crates/infrarust_config",
    "crates/infrarust-core",
    "crates/infrarust_server_manager",
    "crates/infrarust-transport",
    "crates/infrarust-plugin-common",
    "crates/infrarust-plugin-wit",
    "crates/infrarust-loader-wasm",
    "crates/infrarust-plugin-sdk",
    "crates/infrarust-plugin-macros",
    "crates/infrarust-test-harness",
    "crates/infrarust",
    "plugins/infrarust-plugin-auth",
    "plugins/infrarust-plugin-hello",
    "plugins/infrarust-plugin-server-wake",
    "plugins/infrarust-plugin-admin-api",
    "plugins/infrarust-plugin-stats",
    "plugins/infrarust-plugin-stats/native",
    "tools/registry-extractor",
    "tools/stress-test",
    "tools/mc-bench",
]
exclude = [
    "crates/infrarust-loader-wasm/tests/fixtures",
    "plugins/infrarust-plugin-stats/wasm",
    "templates/plugin-template",
]

[workspace.dependencies]
tokio = { version = "1.53.1", features = ["net", "io-util", "sync", "time", "macros", "rt"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
tokio-stream = "0.1.19"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yml = "0.0.13"
toml = "1.1.6"
toml_edit = "0.25.15"
fastnbt = "2.6.3"

# Data types
bytes = "1.12.1"
uuid = { version = "1.26.1", features = ["v3", "v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
humantime = "2.4.0"
humantime-serde = "1.1.1"
ipnet = { version = "2.12.2", features = ["serde"] }

# Error handling
thiserror = "2.0.21"
anyhow = "1.0.104"

# Logging / Tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "registry"] }

# Telemetry (OpenTelemetry)
opentelemetry = { version = "0.33.0" }
opentelemetry_sdk = { version = "0.33.0" }
opentelemetry-otlp = { version = "0.33.0", features = ["grpc-tonic", "http-proto"] }
tracing-opentelemetry = { version = "0.34.0" }

# CLI
clap = { version = "4.6.7", features = ["derive"] }
comfy-table = { version = "8.0.1", features = ["tty"] }
console = "0.16.6"
dialoguer = "0.12.0"

# Networking
reqwest = { version = "0.13.5", default-features = false, features = ["rustls","query", "json"] }
socket2 = { version = "0.6.5", features = ["all"] }
ppp = "2.3.0"

# Concurrency / State
smallvec = "1.16.2"
dashmap = "6.2.1"
governor = "0.10.4"
notify = "8.2.0"
futures-util = "0.3.34"
async-stream = "0.3.6"

# Compression
flate2 = "1.1.10"
libdeflater = "1.26.1"

# Crypto (protocol)
aes = "0.9.3"
cfb8 = "0.9.1"
cipher = "0.5.2"
rsa = { version = "0.9.10", features = ["sha1", "sha2", "getrandom"] }
md-5 = "0.11.0"
sha1 = "0.11.0"
sha2 = "0.11.0"
hmac = "0.13.0"
rand = "0.10.3"
num-bigint = "0.5.1"
base64 = "0.23.1"

# Crypto (auth plugin)
argon2 = "0.6.0"
bcrypt = "0.19.3"

# Web (admin API)
axum = "0.8.9"
tower = { version = "0.5.3", features = ["limit"] }
tower-http = { version = "0.7.1", features = ["cors", "compression-gzip", "trace", "timeout"] }
subtle = "2.6.1"
time = { version = "0.3.55", features = ["formatting", "macros"] }
rust-embed = { version = "8.12.0", features = ["interpolate-folder-path"] }
mime_guess = "2.0.5"
http-body-util = "0.1.5"

# Docker
bollard = "0.21.1"

# Pattern matching
wildmatch = "2.6.1"

# Platform-specific
nix = { version = "0.31.3", features = ["fs", "net", "zerocopy"] }
listenfd = "1.0.2"
mimalloc = "0.1.52"

# Testing
tempfile = "3.27.0"
command-fds = "0.3.3"
rusty-fork = "0.3.1"

# Benchmarking / load testing
divan = "0.1.21"
hdrhistogram = { version = "7.6.0", default-features = false }
quanta = "0.12.6"

# WASM plugin loader (host). Pinned >= 43.0.1 (post-RUSTSEC-2026-0096).
wasmtime = { version = "49.0.1", default-features = false, features = [
    "addr2line",
    "anyhow",
    "async",
    "backtrace",
    "cache",
    "compile-time-builtins",
    "component-model",
    "component-model-async",
    "coredump",
    "cranelift",
    "debug",
    "debug-builtins",
    "demangle",
    "gc",
    "gc-copying",
    "gc-drc",
    "gc-null",
    "parallel-compilation",
    "pooling-allocator",
    "profiling",
    "runtime",
    "stack-switching",
    "std",
    "threads",
    "wit-parser",
] }
wasmtime-wasi = { version = "49.0.1" }
wasmtime-wasi-http = { version = "49.0.1", default-features = false, features = ["p2"] }
hyper = { version = "1.11.1", default-features = false, features = ["client", "http1"] }
http = "1.5.0"
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls-platform-verifier = "0.7.1"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }

# WASM plugin SDK (guest) + proc-macros
wit-bindgen = "0.62.0"
syn = { version = "3.0.6", features = ["full"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"

# Internal crates
infrarust_protocol = { path = "crates/infrarust_protocol", version = "2.0.0-beta.3" }
infrarust-api = { path = "crates/infrarust-api", version = "2.0.0-beta.3" }
infrarust_config = { path = "crates/infrarust_config", version = "2.0.0-beta.3" }
infrarust-transport = { path = "crates/infrarust-transport", version = "2.0.0-beta.3" }
infrarust-core = { path = "crates/infrarust-core", version = "2.0.0-beta.3" }
infrarust_server_manager = { path = "crates/infrarust_server_manager", version = "2.0.0-beta.3" }
infrarust-plugin-common = { path = "crates/infrarust-plugin-common", version = "2.0.0-beta.3" }
infrarust-plugin-wit = { path = "crates/infrarust-plugin-wit", version = "2.0.0-beta.3" }
infrarust-loader-wasm = { path = "crates/infrarust-loader-wasm", version = "2.0.0-beta.3" }
infrarust-plugin-macros = { path = "crates/infrarust-plugin-macros", version = "2.0.0-beta.3" }

# Internal plugins
infrarust-plugin-auth = { path = "plugins/infrarust-plugin-auth", version = "2.0.0-beta.3" }
infrarust-plugin-hello = { path = "plugins/infrarust-plugin-hello", version = "2.0.0-beta.3" }
infrarust-plugin-server-wake = { path = "plugins/infrarust-plugin-server-wake", version = "2.0.0-beta.3" }
infrarust-plugin-admin-api = { path = "plugins/infrarust-plugin-admin-api", version = "2.0.0-beta.3" }
infrarust-plugin-stats = { path = "plugins/infrarust-plugin-stats", version = "2.0.0-beta.3" }
infrarust-plugin-stats-native = { path = "plugins/infrarust-plugin-stats/native", version = "2.0.0-beta.3" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
await_holding_lock = "warn"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"

[workspace.lints.rust]
unsafe_code = "warn"
unused_qualifications = "warn"

[workspace.package]
version = "2.0.0-beta.3"
edition = "2024"
rust-version = "1.98.1"
license-file = "LICENSE"
repository = "https://github.com/Shadowner/Infrarust"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[profile.dev.package]
flate2 = { opt-level = 2 }
libdeflater = { opt-level = 2 }
aes = { opt-level = 2 }
cfb8 = { opt-level = 2 }
rsa = { opt-level = 2 }
num-bigint-dig = { opt-level = 2 }
sha1 = { opt-level = 2 }
sha2 = { opt-level = 2 }
