[workspace]
resolver = "3"
members = [
    "crates/infrarust_protocol",
    "crates/infrarust-api",
    "crates/infrarust_config",
    "crates/infrarust-core",
    "crates/infrarust_server_manager",
    "crates/infrarust-transport",
    "crates/infrarust-plugin-wit",
    "crates/infrarust-loader-wasm",
    "crates/infrarust-plugin-sdk",
    "crates/infrarust-plugin-macros",
    "crates/infrarust",
    "plugins/infrarust-plugin-auth",
    "plugins/infrarust-plugin-hello",
    "plugins/infrarust-plugin-server-wake",
    "plugins/infrarust-plugin-admin-api",
    "plugins/infrarust-plugin-stats",
    "plugins/infrarust-plugin-stats/native",
    "tools/registry-extractor",
    "tools/stress-test",
    "tools/mc-bench",
]
exclude = [
    "crates/infrarust-loader-wasm/tests/fixtures",
    "plugins/infrarust-plugin-stats/wasm",
    "templates/plugin-template",
]

[workspace.dependencies]
tokio = { version = "1.51.0", features = ["net", "io-util", "sync", "time", "macros", "rt"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = "0.1.18"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yml = "0.0.13"
toml = "0.9.8"
toml_edit = "0.25.13"
fastnbt = "2.6.1"

# Data types
bytes = "1.11.1"
uuid = { version = "1.23.3", features = ["v3", "v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
humantime = "2.3.0"
humantime-serde = "1.1.1"
ipnet = { version = "2.12.0", features = ["serde"] }

# Error handling
thiserror = "2.0.18"
anyhow = "1.0.102"

# Logging / Tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "registry"] }

# Telemetry (OpenTelemetry)
opentelemetry = { version = "0.32.0" }
opentelemetry_sdk = { version = "0.32.1" }
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic", "http-proto"] }
tracing-opentelemetry = { version = "0.33.0" }

# CLI
clap = { version = "4.6.1", features = ["derive"] }
comfy-table = { version = "7.2.2", features = ["tty"] }
console = "0.16.3"
dialoguer = "0.12.0"
minus = { version = "5.7.1", features = ["static_output"] }

# Networking
reqwest = { version = "0.13.4", default-features = false, features = ["rustls","query", "json"] }
socket2 = { version = "0.6.4", features = ["all"] }
ppp = "2.3.0"

# Concurrency / State
smallvec = "1.15.1"
dashmap = "6.2.1"
governor = "0.10.4"
notify = "8.2.0"
futures-util = "0.3.32"
async-stream = "0.3.6"

# Compression
flate2 = "1.1.9"
libdeflater = "1.25.2"

# Crypto (protocol)
aes = "0.9.1"
cfb8 = "0.9.1"
cipher = "0.5.2"
rsa = { version = "0.9.10", features = ["sha1"] }
sha1 = "0.11.0"
sha2 = "0.11.0"
hmac = "0.13.0"
# Pinned to 0.8 to match rsa 0.9.x's rand_core 0.6 generation (RSA key gen in
# auth/mojang.rs). Bumping requires rsa 0.10 (currently pre-release only).
rand = "0.8.5"
num-bigint = "0.4.6"
base64 = "0.22.1"

# Crypto (auth plugin)
argon2 = { version = "0.5.3", features = ["std"] }
bcrypt = "0.19.1"
rand_core = { version = "0.9.5", features = ["os_rng"] }

# Web (admin API)
axum = "0.8.9"
tower = { version = "0.5.3", features = ["limit"] }
tower-http = { version = "0.6.8", features = ["cors", "compression-gzip", "trace", "timeout"] }
subtle = "2.6.1"
time = { version = "0.3.47", features = ["formatting", "macros"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2.0.5"
http-body-util = "0.1.3"

# Docker
bollard = "0.21.0"

# Pattern matching
wildmatch = "2.6.1"

# Platform-specific
nix = { version = "0.31", features = ["fs", "net", "zerocopy"] }
listenfd = "1.0.2"
mimalloc = "0.1.52"

# Testing
tempfile = "3.27.0"
command-fds = "0.3.3"
rusty-fork = "0.3.1"

# Benchmarking / load testing
divan = "0.1"
hdrhistogram = { version = "7", default-features = false }
quanta = "0.12"

# WASM plugin loader (host). Pinned >= 43.0.1 (post-RUSTSEC-2026-0096).
wasmtime = { version = "45.0.1", features = ["component-model", "async", "cranelift", "cache"] }
wasmtime-wasi = { version = "45.0.1" }

# WASM plugin SDK (guest) + proc-macros
wit-bindgen = "0.58.0"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

# Internal crates
infrarust_protocol = { path = "crates/infrarust_protocol", version = "2.0.0-beta.1" }
infrarust-api = { path = "crates/infrarust-api", version = "2.0.0-beta.1" }
infrarust_config = { path = "crates/infrarust_config", version = "2.0.0-beta.1" }
infrarust-transport = { path = "crates/infrarust-transport", version = "2.0.0-beta.1" }
infrarust-core = { path = "crates/infrarust-core", version = "2.0.0-beta.1" }
infrarust_server_manager = { path = "crates/infrarust_server_manager", version = "2.0.0-beta.1" }
infrarust-plugin-wit = { path = "crates/infrarust-plugin-wit", version = "2.0.0-beta.1" }
infrarust-loader-wasm = { path = "crates/infrarust-loader-wasm", version = "2.0.0-beta.1" }
infrarust-plugin-macros = { path = "crates/infrarust-plugin-macros", version = "2.0.0-beta.1" }

# Internal plugins
infrarust-plugin-auth = { path = "plugins/infrarust-plugin-auth", version = "2.0.0-beta.1" }
infrarust-plugin-hello = { path = "plugins/infrarust-plugin-hello", version = "2.0.0-beta.1" }
infrarust-plugin-server-wake = { path = "plugins/infrarust-plugin-server-wake", version = "2.0.0-beta.1" }
infrarust-plugin-admin-api = { path = "plugins/infrarust-plugin-admin-api", version = "2.0.0-beta.1" }
infrarust-plugin-stats = { path = "plugins/infrarust-plugin-stats", version = "2.0.0-beta.1" }
infrarust-plugin-stats-native = { path = "plugins/infrarust-plugin-stats/native", version = "2.0.0-beta.1" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
await_holding_lock = "warn"
dbg_macro = "warn"
todo = "warn"

[workspace.lints.rust]
unsafe_code = "warn"
unused_qualifications = "warn"

[workspace.package]
version = "2.0.0-beta.1"
edition = "2024"
rust-version = "1.94"
license-file = "LICENSE"
repository = "https://github.com/Shadowner/Infrarust"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[profile.dev.package]
flate2 = { opt-level = 2 }
libdeflater = { opt-level = 2 }
aes = { opt-level = 2 }
cfb8 = { opt-level = 2 }
rsa = { opt-level = 2 }
sha1 = { opt-level = 2 }
sha2 = { opt-level = 2 }