name: Pull Request Checks

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'crates/**'
      - 'plugins/**'
      - 'tools/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - '.github/workflows/pr-checks.yml'
      - '.github/actions/build-frontend/**'
  push:
    branches: [ main ]
    paths:
      - 'crates/**'
      - 'plugins/**'
      - 'tools/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - '.github/workflows/pr-checks.yml'
      - '.github/actions/build-frontend/**'
  schedule:
    - cron: '0 4 */3 * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt
          targets: wasm32-wasip2

      - name: Check formatting
        run: |
          cargo fmt -- --check
          cargo fmt --manifest-path plugins/infrarust-plugin-stats/wasm/Cargo.toml -- --check

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: |
            .
            plugins/infrarust-plugin-stats/wasm

      - name: Build Admin Frontend
        uses: ./.github/actions/build-frontend

      - name: Run clippy
        env:
          INFRARUST_WASM_FIXTURES_SKIP: 1
        run: |
          cargo clippy -- -D warnings
          cargo clippy --manifest-path plugins/infrarust-plugin-stats/wasm/Cargo.toml \
            --target wasm32-wasip2 -- -D warnings

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: wasm
            args: -p infrarust-loader-wasm --features wasm
          - suite: workspace
            args: --workspace --exclude infrarust-loader-wasm
    name: test (${{ matrix.suite }})
    env:
      INFRARUST_WASM_TARGET_DIR: ${{ github.workspace }}/.wasm-fixtures
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-wasip2

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.suite }}

      - name: WASM fixtures cache
        if: matrix.suite == 'wasm'
        uses: actions/cache@v6.1.0
        with:
          path: .wasm-fixtures
          key: wasm-fixtures-${{ runner.os }}-1.99.0-${{ hashFiles('crates/infrarust-loader-wasm/tests/fixtures/Cargo.lock', 'plugins/infrarust-plugin-stats/wasm/Cargo.lock') }}

      - name: Build Admin Frontend
        if: matrix.suite == 'workspace'
        uses: ./.github/actions/build-frontend

      - name: Build tests
        run: cargo test --no-run ${{ matrix.args }}

      - name: Run tests
        run: |
          set -o pipefail
          cargo test ${{ matrix.args }} 2>&1 | tee test.log

      - name: Check the WASM tests ran
        if: matrix.suite == 'wasm'
        run: |
          grep -q 'test test_stats_count_command \.\.\. ok' test.log \
            || { echo "::error::WASM fixture tests did not run"; exit 1; }
          grep -q 'test pre_login_deny_wasm \.\.\. ok' test.log \
            || { echo "::error::WASM conformance tests did not run"; exit 1; }
