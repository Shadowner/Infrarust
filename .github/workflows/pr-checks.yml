name: Pull Request Checks

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'crates/**'
      - 'plugins/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-wasip2

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Admin Frontend
        uses: ./.github/actions/build-frontend

      - name: Check formatting
        run: cargo fmt -- --check
        
      - name: Run clippy
        run: cargo clippy -- -D warnings
        
      - name: Run tests
        run: cargo test

      - name: Run WASM loader tests
        run: |
          set -o pipefail
          cargo test -p infrarust-loader-wasm --features wasm 2>&1 | tee wasm-tests.log
          grep -Eq 'running [1-9][0-9]* tests' wasm-tests.log \
            || { echo "::error::WASM test suite ran 0 tests"; exit 1; }

      - name: Lint excluded stats wasm plugin
        working-directory: plugins/infrarust-plugin-stats/wasm
        run: |
          cargo fmt -- --check
          cargo clippy --release --target wasm32-wasip2 -- -D warnings
