x-mc: &mc
  tty: true
  stdin_open: true
  restart: "no"
  environment: &mc-env
    EULA: "TRUE"
    ONLINE_MODE: "FALSE"
    GUI: "FALSE"
    MEMORY: "1G"
    LEVEL_TYPE: "FLAT"
    VIEW_DISTANCE: "4"
    SIMULATION_DISTANCE: "4"
    SPAWN_PROTECTION: "0"
    SPAWN_ANIMALS: "FALSE"
    SPAWN_MONSTERS: "FALSE"
    SPAWN_NPCS: "FALSE"
    SYNC_CHUNK_WRITES: "FALSE"
    MAX_PLAYERS: "20"
  healthcheck:
    test: ["CMD", "mc-health"]
    start_period: 20s
    interval: 5s
    retries: 40

x-velocity-modern: &velocity-modern
  <<: *mc-env
  TYPE: "PAPER"
  CFG_VELOCITY_SECRET: "e2eSecretForVelocityForwarding01"

services:
  drasl:
    profiles: ["auth"]
    image: docker.io/unmojang/drasl:3.4.4
    container_name: e2e-drasl
    ports: ["25585:25585"]
    volumes:
      - ./fixtures/drasl:/etc/drasl:z
      - ./.drasl-data:/var/lib/drasl:z
    restart: "no"

  plain-1_21_4:
    <<: *mc
    profiles: ["v1_21_4"]
    image: docker.io/itzg/minecraft-server:java21
    container_name: e2e-plain-1-21-4
    environment: { <<: *mc-env, TYPE: "PAPER", VERSION: "1.21.4" }
    ports: ["25700:25565"]

  velocity-1_21_4:
    <<: *mc
    profiles: ["v1_21_4"]
    image: docker.io/itzg/minecraft-server:java21
    container_name: e2e-velocity-1-21-4
    environment: { <<: *velocity-modern, VERSION: "1.21.4" }
    volumes: ["./.paper/config:/data/config:z"]
    ports: ["25701:25565"]

  bungee-1_21_4:
    <<: *mc
    profiles: ["v1_21_4"]
    image: docker.io/itzg/minecraft-server:java21
    container_name: e2e-bungee-1-21-4
    environment: { <<: *mc-env, TYPE: "PAPER", VERSION: "1.21.4" }
    volumes: ["./.paper/spigot.yml:/data/spigot.yml:z"]
    ports: ["25702:25565"]

  plain-1_20_1:
